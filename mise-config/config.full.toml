# Module full: the whole personal toolbox (ported from budybye/dotfiles). Requires agent (npm: tools use bun).

[settings]
cargo.binstall = true
rust.cargo_home = "~/.local/share/cargo"
rust.rustup_home = "~/.local/share/rustup"

[bootstrap.packages]
"apt:apt-utils" = "latest"
"apt:wget" = "latest"
"apt:cmake" = "latest"
"apt:ncdu" = "latest"
"apt:multitail" = "latest"
"apt:moreutils" = "latest"
"apt:autoconf" = "latest"
"apt:lsb-release" = "latest"
"apt:libdb-dev" = "latest"
"apt:libgdbm-dev" = "latest"
"apt:libgmp-dev" = "latest"
"apt:libgmpxx4ldbl" = "latest"
"apt:libgdbm-compat-dev" = "latest"
"apt:libstd-rust-dev" = "latest"
"apt:libncurses-dev" = "latest"     # libncurses5-dev is gone in 26.04
"apt:libffi-dev" = "latest"
"apt:net-tools" = "latest"
"apt:nmap" = "latest"
"apt:rsyslog" = "latest"
"apt:ruby" = "latest"
"apt:rsync" = "latest"
"apt:command-not-found" = "latest"
# GUI: only when the desktop module is selected too (env gating keeps headless full machines CLI-only)
"apt:flatpak" = { version = "latest", env = "desktop" }
"apt:libnss3-tools" = { version = "latest", env = "desktop" }          # browser certificate stores (mkcert)
"apt:libfreetype-dev" = { version = "latest", env = "desktop" }        # libfreetype6-dev is gone in 26.04
"apt:libfontconfig1-dev" = { version = "latest", env = "desktop" }
"apt:libxcb-xfixes0-dev" = { version = "latest", env = "desktop" }
"apt:libxkbcommon-dev" = { version = "latest", env = "desktop" }
"apt:libgtk-3-dev" = { version = "latest", env = "desktop" }
"apt:libwebkit2gtk-4.1-dev" = { version = "latest", env = "desktop" }
"apt:libgtk-layer-shell-dev" = { version = "latest", env = "desktop" }
"apt:mpd" = { version = "latest", env = "desktop" }
"apt:mpc" = { version = "latest", env = "desktop" }
"apt:ncmpcpp" = { version = "latest", env = "desktop" }

