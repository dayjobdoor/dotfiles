# Module desktop: XFCE session over xrdp with Japanese input and fonts.

[bootstrap.packages]
"apt:xfce4" = "latest"
"apt:xfce4-terminal" = "latest"
"apt:xfce4-screenshooter" = "latest"
"apt:xfce4-taskmanager" = "latest"
"apt:xfce4-clipman-plugin" = "latest"
"apt:xfce4-xkb-plugin" = "latest"
"apt:xrdp" = "latest"
"apt:xorgxrdp" = "latest"
"apt:dbus-x11" = "latest"
"apt:fcitx5-mozc" = "latest"
"apt:language-pack-ja" = "latest"
"apt:language-pack-ja-base" = "latest"
"apt:manpages-ja" = "latest"
"apt:fonts-noto-cjk" = "latest"
"apt:fonts-noto-color-emoji" = "latest"
"apt:ghostty" = "latest"
"apt:xsel" = "latest"
"apt:xdotool" = "latest"

# overrides the base C.UTF-8 locale
[bootstrap.files."/etc/locale.conf"]
content = "LANG=ja_JP.UTF-8\n"
mode = "0644"
owner = "root"
group = "root"

# Purges screen lockers and im-config, then installs HackGen NF (hooks/desktop-final).
[bootstrap.hooks]
final = "~/.config/mise/hooks/desktop-final"

[dotfile_groups.desktop]
root = "desktop"
