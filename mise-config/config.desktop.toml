# Module desktop: XFCE session over xrdp with Japanese input and fonts.

[bootstrap.packages]
"apt:xfce4" = "latest"
"apt:xfce4-terminal" = "latest"
"apt:xfce4-screenshooter" = "latest"
"apt:xfce4-taskmanager" = "latest"
"apt:xfce4-clipman-plugin" = "latest"
"apt:xfce4-xkb-plugin" = "latest"
"apt:xrdp" = "latest"
"apt:xorgxrdp" = "latest"
# Audio over RDP. pipewire-module-xrdp loads xrdp-sink and xrdp-source from an XDG autostart entry, which needs
# a PipeWire server in the session (desktop/.xsession starts one where systemd does not). That script calls
# pactl, from pulseaudio-utils, to make the two the defaults; without it a machine with a sound card keeps playing
# locally. pipewire-pulse gives PulseAudio clients such as browsers a way in. There is no pulseaudio daemon.
"apt:pipewire" = "latest"
"apt:pipewire-pulse" = "latest"
"apt:wireplumber" = "latest"
"apt:pipewire-module-xrdp" = "latest"
"apt:pulseaudio-utils" = "latest"
"apt:dbus-x11" = "latest"
"apt:fcitx5-mozc" = "latest"
"apt:language-pack-ja" = "latest"
"apt:language-pack-ja-base" = "latest"
"apt:manpages-ja" = "latest"
"apt:fonts-noto-cjk" = "latest"
"apt:fonts-noto-color-emoji" = "latest"
"apt:ghostty" = "latest"
"apt:xsel" = "latest"
"apt:xdotool" = "latest"

# overrides the base C.UTF-8 locale
[bootstrap.files."/etc/locale.conf"]
content = "LANG=ja_JP.UTF-8\n"
mode = "0644"
owner = "root"
group = "root"

# Purges screen lockers and im-config, then installs HackGen NF (hooks/desktop-final).
[bootstrap.hooks]
final = "~/.config/mise/hooks/desktop-final"

[dotfile_groups.desktop]
root = "desktop"
