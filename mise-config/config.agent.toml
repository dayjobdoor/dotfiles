# Module agent: runtimes and coding-agent CLIs for sandboxes.

[settings]
npm.package_manager = "bun"
# pypi: tools install through uv (below) instead of pipx
pypi.uvx = true
# pi and omp are deliberately exempt from the 3-day minimum_release_age in config.toml: they release often and
# each new release is wanted at once.
minimum_release_age_excludes = ["pi", "github:can1357/oh-my-pi"]

# Tools started through a shim see [env] in any shell type, so docker exec and sh -c share the locations of login shells.
# A variable in .profile would reach only login shells, and bun would split its cache between the two.
# PI_TELEMETRY is read by pi; DO_NOT_TRACK by skills and bun.
[env]
NPM_CONFIG_CACHE = "{{xdg_cache_home}}/npm"
NPM_CONFIG_USERCONFIG = "{{xdg_config_home}}/npm/npmrc"
BUN_INSTALL_CACHE_DIR = "{{xdg_cache_home}}/bun"
PI_TELEMETRY = "0"
# pi reads its agent directory from PI_CODING_AGENT_DIR. omp ignores that variable once OMP_PROFILE is set and reads
# ~/.config/omp/profiles/<profile>/agent instead; PI_CONFIG_DIR moves omp's ~/.omp under ~/.config/omp.
# The files themselves are the home dotfile group: home/.config/pi/ and home/.config/omp/.
PI_CODING_AGENT_DIR = "{{xdg_config_home}}/pi/agent"
PI_CONFIG_DIR = ".config/omp"
OMP_PROFILE = "god"
PI_NATIVES_DIR = "{{xdg_config_home}}/omp/profiles/god/natives"
DO_NOT_TRACK = "1"

[tools]
node = "lts"
bun = "latest"
python = "latest"
uv = "latest"
pi = "latest"
"github:can1357/oh-my-pi" = "latest"
"npm:skills" = "latest"

[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:pkg-config" = "latest"
"apt:libssl-dev" = "latest"
