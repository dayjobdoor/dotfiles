# Global mise config for every machine (linked as ~/.config/mise).
# Modules: config.<module>.toml, selected per machine in miserc.local.toml via `djd module`.
# [bootstrap], [dotfile_groups] and the hooks below need this release or later; djd update keeps up.
min_version = "2026.10.23"

[settings]
# No lockfile on purpose: image digests pin the sandboxes. Add lockfile = true and run mise lock --global if
# machines must match bit for bit.
# the supply-chain brake: a tool release younger than three days is skipped (config.agent.toml exempts two tools)
minimum_release_age = "3d"
# the checkout is trusted, so its mise.toml (the repo tasks) and the mise-config linked as ~/.config/mise load
# without `mise trust`; this is why whoever can change that checkout runs code on the machine
trusted_config_paths = ["~/.dotfiles"]
# mise's tool directories stay ahead of PATH entries that a shell adds after `mise activate`
activate_aggressive = true
# parallel tool installs, written out although 8 is mise's default, so that a changed default does not slow the
# full module's about 180 tools
jobs = 8
# mise does not borrow the token that `gh auth login` stored in hosts.yml; set MISE_GITHUB_TOKEN where one is wanted
github.gh_cli_tokens = false

[tools]
usage = "latest"
starship = "latest"
zoxide = "latest"
fzf = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
lsd = "latest"
sd = "latest"
jq = "latest"
yq = "latest"
delta = "latest"
gh = "latest"
lazygit = "latest"
jj = "latest"
"github:dmmulroy/jj-starship" = "latest" # the prompt's git and jj segment (starship.toml custom.jj)
bottom = "latest"
micro = "latest"
herdr = "latest"
shellcheck = "latest"
shfmt = "latest"

[bootstrap.packages]
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:zsh" = "latest"
"apt:sudo" = "latest"
"apt:locales" = "latest"
"apt:tzdata" = "latest"
"apt:less" = "latest"
"apt:vim" = "latest"
"apt:unzip" = "latest"
"apt:tree" = "latest"
"apt:sqlite3" = "latest"
"apt:openssh-client" = "latest"
"apt:gnupg" = "latest"
"apt:fastfetch" = "latest"
"apt:make" = "latest"

# English system locale for agents; config.desktop.toml overrides it. Declaring it here also means
# removing the desktop module restores this content instead of deleting the file.
# 26.04 `locales` turns /etc/default/locale into a symlink to this file.
[bootstrap.files."/etc/locale.conf"]
content = "LANG=C.UTF-8\n"
mode = "0644"
owner = "root"
group = "root"

[bootstrap.user]
login_shell = "zsh"

[bootstrap.hooks]
# mise runs a plain `chsh` in the user phase, which asks for a password that cloud and OrbStack users
# don't have; switching via sudo first leaves that phase a no-op.
pre-user = 'z=$(command -v zsh); u=$(id -un); [ "$(getent passwd "$u" | cut -d: -f7)" = "$z" ] || sudo chsh -s "$z" "$u"'
# Symlink entries refuse real files; hooks/dotfile-conflicts moves them aside (dotfiles part only).
pre-dotfiles = "~/.config/mise/hooks/dotfile-conflicts home"

[dotfile_groups.home]
root = "home"

# zsh plugins, sourced by .zshrc. Every plugin is pinned to a commit, because a default branch would put
# whatever it holds that day into shells that may see secrets. To update one, set a newer `ref`. A commit ref
# rules out `depth`, so these are full clones.
[bootstrap.repos]
"~/.local/share/zsh/plugins/zsh-defer" = { url = "https://github.com/romkatv/zsh-defer", ref = "53a26e287fbbe2dcebb3aa1801546c6de32416fa" }
"~/.local/share/zsh/plugins/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting", ref = "4672ad5dd9ad68a7effc1476d65afb7c584ce2b3" }
"~/.local/share/zsh/plugins/zsh-completions" = { url = "https://github.com/zsh-users/zsh-completions", ref = "989b23277ab33e8d5e82df6aed936e846db9d8b8" }
"~/.local/share/zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions", ref = "85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5" }
"~/.local/share/zsh/plugins/zsh-autopair" = { url = "https://github.com/hlissner/zsh-autopair", ref = "449a7c3d095bc8f3d78cf37b9549f8bb4c383f3d" }
"~/.local/share/zsh/plugins/forgit" = { url = "https://github.com/wfxr/forgit", ref = "8b638f4765cabe41bf3e86196cfcce388daa9266" }
"~/.local/share/zsh/plugins/git-open" = { url = "https://github.com/paulirish/git-open", ref = "63c0e77aaf18b72c839b1113c1e2f9514413643b" }
