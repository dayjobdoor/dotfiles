# Module secrets: personal environment secrets, committed only as age ciphertext.
# Select it only on machines you own, never in agent sandboxes: everything run there sees the values.
# Add or change a value with `djd secret set NAME`; mise set adds it under [env].

[settings]
# mise marks age encryption experimental, and this is the only module that decrypts
experimental = true
age.key_file = "~/.config/djd/age.txt"
# a machine without the key keeps working; its values are just unset
age.strict = false
