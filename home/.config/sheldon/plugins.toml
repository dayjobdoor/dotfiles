# zsh plugins, fetched and sourced by sheldon (`sheldon source` in ~/.config/zsh/.zshrc).
# Every plugin is pinned to a commit with `rev`, because a default branch would put whatever it holds that day into
# shells that may see secrets. To update one, set a newer `rev` and run `djd apply`; hooks/sheldon-lock then fetches it.
# Sheldon checks out the submodules of a plugin at the commit that the plugin pins, so zsh-abbr brings its own
# zsh-job-queue. A plugin loads in file order, and zsh-defer comes first because the others are sourced through it.
shell = "zsh"

[templates]
defer = "{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}"
PATH = 'export PATH="$PATH:{{ dir }}"'

[plugins.zsh-defer]
github = "romkatv/zsh-defer"
rev = "53a26e287fbbe2dcebb3aa1801546c6de32416fa"

# completions: only the fpath entry. compinit runs in .zshrc after sheldon, so it indexes these files
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
rev = "989b23277ab33e8d5e82df6aed936e846db9d8b8"
dir = "src"
apply = ["fpath"]

[plugins.fast-syntax-highlighting]
github = "zdharma-continuum/fast-syntax-highlighting"
rev = "4672ad5dd9ad68a7effc1476d65afb7c584ce2b3"
apply = ["defer"]

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
rev = "85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5"
use = ["zsh-autosuggestions.zsh"]
apply = ["defer"]

[plugins.zsh-autopair]
github = "hlissner/zsh-autopair"
rev = "449a7c3d095bc8f3d78cf37b9549f8bb4c383f3d"
apply = ["defer"]

# abbreviations: home/.config/zsh-abbr/user-abbreviations
[plugins.zsh-abbr]
github = "olets/zsh-abbr"
rev = "4facba32711875fb2049720a0f6d6d5c3b56b986"
apply = ["defer"]

[plugins.forgit]
github = "wfxr/forgit"
rev = "8b638f4765cabe41bf3e86196cfcce388daa9266"
apply = ["defer"]

[plugins.git-open]
github = "paulirish/git-open"
rev = "63c0e77aaf18b72c839b1113c1e2f9514413643b"
apply = ["defer"]

# j, jc, jo and jco, over a database in $XDG_DATA_HOME/autojump. The release (22.5.3) starts with `python`, which
# Ubuntu does not have; the master commit below starts with `python3`. It runs next to zoxide's z and zi.
[plugins.autojump]
github = "wting/autojump"
rev = "ee21082751da739c65fe0ec2d02ca95d4266aebc"
dir = "bin"
apply = ["PATH", "defer"]

# cd with a history and a filter (fzf): it replaces the cd function of the shell. Its history is in
# $XDG_STATE_HOME/enhancd, set in .zshrc.
[plugins.enhancd]
github = "b4b4r07/enhancd"
rev = "b911969f32c69402954da97d84b549303638cb1f"
use = ["init.sh"]
apply = ["defer"]
