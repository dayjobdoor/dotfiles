# Active keys only; the lsd README documents each one.
classic: false
blocks:
  - permission
  - user
  - group
  - size
  - date
  - links
  - git
  - name
color:
  when: auto
  theme: custom
date: '+%m/%d %y %T'
dereference: false
icons:
  when: always
  theme: fancy
  separator: " "
indicators: false
layout: grid
recursion:
  enabled: false
  depth: 3
size: default
permission: rwx
sorting:
  column: name
  reverse: false
  dir-grouping: none
no-symlink: false
total-size: false
hyperlink: never
symlink-arrow: ⇒
header: false
