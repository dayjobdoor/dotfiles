# Only the values that differ from herdr's defaults. `herdr config check` validates this file.
onboarding = false

[theme]
name = "kanagawa"

[terminal]
default_shell = "zsh"
shell_mode = "non_login"

[ui]
sidebar_width = 28
prompt_new_tab_name = false

[ui.toast]
delivery = "off"

[experimental]
pane_history = false
reveal_hidden_cursor_for_cjk_ime = true
