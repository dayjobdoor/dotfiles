#cloud-config
# One file for an incus container and a multipass VM; the README has the commands. Above the marker below it sets the hostname, the user, timezone, keyboard and packages. Below the marker it
# imports an SSH key and runs the install. test:vm stops reading at the marker: it installs the
# checkout itself, and the VM has no key of the owner.
# RDP needs a password. It is not in this file (SECURITY.md forbids a committed passwd): the README recipe appends a
# hashed chpasswd block at launch for multipass, and `incus exec vm -- passwd dayjobdoor` sets one in incus

hostname: vm
timezone: Asia/Tokyo
keyboard:
  model: pc105
  layout: jp
  options: ctrl:nocaps

# dayjobdoor is the user of every VM. The default user (ubuntu) stays: multipass reaches the VM through it.
users:
  - default
  - name: dayjobdoor
    gecos: dayjobdoor
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true

package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - ssh-import-id

# No ssh_pwauth: on an image without openssh-server, cloud-init would write a one-line
# /etc/ssh/sshd_config that the package then keeps, without its sshd_config.d Include. Ubuntu cloud images
# keep passwords off by default, and the server module turns password SSH off.

# djd-install-below
# SECURITY: the first command imports the public keys of the GitHub account below into dayjobdoor, which has
# passwordless sudo, so that account gets root over SSH on the VM. Forks: replace it with your own GitHub user before
# launching. The server module refuses to turn passwords off for a user without a key, so a failed import (GitHub's API
# limits anonymous callers) stops the install instead of locking the VM.
# Both run as dayjobdoor, after the packages.
runcmd:
  - su - dayjobdoor -c 'ssh-import-id gh:dayjobdoor'
  - su - dayjobdoor -c 'curl -fsSL https://raw.githubusercontent.com/dayjobdoor/dotfiles/main/install.sh | sh -s -- server'
