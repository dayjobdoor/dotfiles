#cloud-config
# Neutral setup for trying these dotfiles in an incus container, a multipass VM or an OrbStack
# machine; test:vm uses it for all three. It only sets the hostname, timezone and packages: the install itself is
# a separate step. README.md has the incus and multipass commands, and docs/how-to.md the OrbStack ones.

hostname: djd-vm
timezone: Asia/Tokyo

package_update: true
packages:
  - ca-certificates
  - curl
  - git

# No ssh_pwauth: on an image without openssh-server, cloud-init would write a one-line
# /etc/ssh/sshd_config that the package then keeps, without its sshd_config.d Include. The server
# module turns password SSH off.
