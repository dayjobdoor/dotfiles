#cloud-config
# multipass launch 26.04 --name djd --cpus 4 --memory 8G --disk 40G --timeout 3600 --cloud-init cloud-init/multipass.yaml
# RDP needs a password: multipass exec djd -- sudo passwd ubuntu
timezone: Asia/Tokyo
keyboard:
  model: pc105
  layout: jp
  options: ctrl:nocaps

ssh_pwauth: false
# the owner's GitHub keys; forks: change this to your own GitHub user
ssh_import_id:
  - gh:dayjobdoor

package_update: true
packages:
  - ca-certificates
  - curl
  - git

runcmd:
  - [su, -, ubuntu, -c, "curl -fsSL https://raw.githubusercontent.com/dayjobdoor/dotfiles/main/install.sh | sh -s -- server desktop"]
