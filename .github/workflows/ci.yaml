name: CI
on:
  push:
    branches: [main]
    # Markdown-only changes (llms.txt included) skip CI, except DESIGN.md (lint checks it) and home/.config/pi, home/.config/omp (their AGENTS.md and RULES.md ship in the
    # image and the image test checks them)
    paths: ["**", "!docs/**", "!**/*.md", "!llms.txt", "DESIGN.md", "home/.config/pi/**", "home/.config/omp/**"]
  pull_request:
    paths: ["**", "!docs/**", "!**/*.md", "!llms.txt", "DESIGN.md", "home/.config/pi/**", "home/.config/omp/**"]
  # tools track `latest`, so a quiet repository still breaks upstream; this run catches it.
  # Scheduled runs never tag a release (tag.yaml accepts push runs only).
  schedule:
    - cron: "0 18 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # per event, so a scheduled run never cancels the push run that tag.yaml waits for
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs the same mise task a developer runs locally (`make test` = `mise run test`);
# `mise run ci <job>` runs the lint and image jobs on your machine with act.
jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # tools install from the URLs and checksums in .mise/mise.lock, so this job calls no GitHub API and needs no token
      MISE_LOCKED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history
          fetch-depth: 0
          persist-credentials: false
      - name: Install zsh for `zsh -n`
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zsh
      # mise itself only; `mise run lint` installs each check's tools, at the versions pinned in .mise/mise.lock
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.23
          install: false
      - name: Lint (shell, mise configs, workflows, Dockerfile, DESIGN.md, docs links, secrets)
        run: mise run lint

  # the one Docker image (the base with the desktop, plus the agent module): offline tests, doctor, tools on PATH, shell
  # startup, backup, secrets, idempotent apply, then RDP login, XFCE session, audio and the desktop apps. The second
  # task reuses the layers that the first one built.
  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # the tasks only drive docker; their tools run inside the image
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.23
          install: false
      - name: Build the image; offline tests, doctor, tools on PATH, shell startup, backup, secrets, idempotent apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise trust .mise/config.toml && mise run test
      - name: RDP login starts XFCE, audio, desktop apps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run test:desktop

  # a fresh Ubuntu system container with systemd, as a VM user gets it
  vm:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install incus
        run: |
          sudo apt-get update
          sudo apt-get install -y incus-base incus-client
          sudo incus admin init --minimal
          # the tests run incus as the runner user; this opens the socket to every local user of the runner
          sudo chmod 666 /var/lib/incus/unix.socket
          # the runner's docker sets the FORWARD policy to DROP, which would cut the containers off
          sudo iptables -I DOCKER-USER -i incusbr0 -j ACCEPT
          sudo iptables -I DOCKER-USER -o incusbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.23
          install: false
      - name: cloud-init, install server, firewall, services, module removal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise trust .mise/config.toml && mise run test:vm
