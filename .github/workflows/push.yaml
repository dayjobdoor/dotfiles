name: Push to ghcr
# Publishes the sandbox and desktop images to GHCR for a semver tag (tag push, or dispatched by tag.yaml).
# sandbox = agent module (latest), desktop = agent + desktop modules (XFCE + xrdp).
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# every job sets its own permissions
permissions: {}

concurrency:
  # a tag push and tag.yaml's dispatch can both start a run for the same ref; keep one
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/dayjobdoor/dotfiles
jobs:
  build-images:
    if: github.ref_type == 'tag'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        flavor:
          - name: sandbox
            modules: "agent"
            smoke: djd doctor
          - name: desktop
            modules: "agent desktop"
            smoke: djd doctor
        include:
          - platform: linux/arm64
            runs-on: ubuntu-26.04-arm
          - platform: linux/amd64
            runs-on: ubuntu-26.04
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Validate release ref
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [[ ! "${RELEASE_TAG}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release ref is not strict SemVer: ${RELEASE_TAG}" >&2
            exit 1
          fi

      # anyone who can push a tag, or dispatch this workflow on one, would otherwise publish any commit with this
      # job's packages: write token. A release is a commit that is on main; tag.yaml dispatches only for such commits
      - name: Require the tagged commit to be on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            identical | behind) ;;
            *)
              echo "Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main (compare status: ${status})" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
          annotations: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # runners are single-use, so skip the post step that removes the builder
          cleanup: false
          # a release build must not install a binary from the Actions cache
          cache-binary: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # no cache-from/cache-to: a published image must not reuse cache entries another workflow could write
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          build-args: |
            DJD_MODULES=${{ matrix.flavor.modules }}
            DJD_REVISION=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # the job's packages: write token reaches the tools layer, the one exception to "a token needs no scope"
          # (SECURITY.md, "The release build")
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      # the pushed bytes, pulled by digest, not the image the CI test ran: a failure here stops merge from moving any tag
      - name: Smoke test the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SMOKE: ${{ matrix.flavor.smoke }}
        run: docker run --rm "$REGISTRY_IMAGE@$DIGEST" sh -c "$SMOKE"

      - name: Set digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          mkdir -p /tmp/digests
          digest="$DIGEST"

          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: ${digest}" >&2
            exit 1
          fi

          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}-${{ matrix.flavor.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      packages: write
    needs: [build-images]
    if: github.ref_type == 'tag'
    steps:
      - name: Validate release ref
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [[ ! "${RELEASE_TAG}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release ref is not strict SemVer: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          # one directory per artifact: the loop below picks a flavor's digests by directory name
          merge-multiple: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
          cache-binary: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists and push
        working-directory: /tmp/digests
        shell: bash
        run: |
          shopt -s nullglob
          # a re-run of an older release, or one that finishes after a newer one, must not move the
          # floating tags (sandbox, latest, X.Y, desktop, X.Y-desktop) back
          newest=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" |
            sed 's#.*refs/tags/##' | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n1)
          minor="${GITHUB_REF_NAME%.*}"

          # Publish sandbox last so the latest tag is the newest manifest in GHCR.
          for flavor in desktop sandbox; do
            digest_files=(digests-*-"${flavor}"/*)
            if [ "${#digest_files[@]}" -eq 0 ]; then
              echo "No digest artifacts found for ${flavor}." >&2
              exit 1
            fi

            refs=()
            for digest_file in "${digest_files[@]}"; do
              refs+=("${REGISTRY_IMAGE}@sha256:$(basename "${digest_file}")")
            done

            if [ "${flavor}" = "sandbox" ]; then
              tags=(-t "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}")
              floating=(sandbox latest "${minor}")
              description="Ubuntu 26.04 dotfiles, agent sandbox (agent module)"
            else
              tags=(-t "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}-desktop")
              floating=(desktop "${minor}-desktop")
              description="Ubuntu 26.04 dotfiles, XFCE desktop over RDP (agent and desktop modules)"
            fi
            if [ "${GITHUB_REF_NAME}" = "${newest}" ]; then
              for t in "${floating[@]}"; do tags+=(-t "${REGISTRY_IMAGE}:${t}"); done
            else
              echo "${GITHUB_REF_NAME} is older than ${newest}; ${floating[*]} stay where they are"
            fi

            # GHCR takes a multi-arch package's description and license from the index, and imagetools writes
            # an index without annotations unless asked
            annotations=(
              --annotation "index:org.opencontainers.image.description=${description}"
              --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
              --annotation "index:org.opencontainers.image.licenses=MIT"
              --annotation "index:org.opencontainers.image.version=${GITHUB_REF_NAME}"
            )
            docker buildx imagetools create "${annotations[@]}" "${tags[@]}" "${refs[@]}"
            # tags[0] is the -t flag; tags[1] is the image reference
            docker buildx imagetools inspect "${tags[1]}"
          done
