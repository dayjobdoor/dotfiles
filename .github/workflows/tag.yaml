name: Tag and Release
# Tags X.Y.Z and creates a GitHub release when CI passes on a push to main.
on:
  # workflow_run is safe here only because the job's `if` accepts push runs from this repository alone
  workflow_run: # jactionlint ignore=dangerous-triggers
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions: {}

jobs:
  release:
    # only CI runs from pushes to this repo's main; a fork PR whose branch is also named main must not get tagged and published
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # the group is on the job, not the workflow, so only runs that pass the `if` queue. A workflow-level group would
    # let a run for a red or cancelled CI replace a waiting release, then skip itself. An in-progress release is never
    # cancelled. GitHub keeps one pending run per group and replaces an older pending run with a newer one; the
    # replaced run's commit is inside the newer run's tag
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    # waits for the push.yaml run; its build job has a 45-minute timeout (2 to 5 minutes measured)
    timeout-minutes: 60
    permissions:
      contents: write # push the tag, create the release
      actions: write # dispatch push.yaml, list its runs
      checks: read # gh run watch reads the annotations of the watched run
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # persist-credentials stays on, unlike every other checkout: the next step pushes the tag with it
          fetch-depth: 0

      - name: Create tag and release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          git fetch --tags origin

          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          semver_latest() {
            git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname |
              while IFS= read -r candidate; do
                if [[ "${candidate}" =~ ${semver_pattern} ]]; then
                  printf '%s\n' "${candidate}"
                  break
                fi
              done
          }

          # reuse a strict SemVer tag that already points at this commit
          existing_tag="$(
            git tag -l '[0-9]*.[0-9]*.[0-9]*' \
              --points-at "$HEAD_SHA" \
              --sort=-v:refname |
              while IFS= read -r candidate; do
                if [[ "${candidate}" =~ ${semver_pattern} ]]; then
                  printf '%s\n' "${candidate}"
                  break
                fi
              done
          )"
          if [ -n "$existing_tag" ]; then
            new_tag="$existing_tag"
            echo "commit ${HEAD_SHA} already tagged: ${new_tag}"
          else
            latest_tag=$(semver_latest)
            [ -z "$latest_tag" ] && latest_tag="0.0.0"
            # a re-run of an older CI run must not release old code as the newest version
            if [ "$latest_tag" != "0.0.0" ] && ! git merge-base --is-ancestor "${latest_tag}^{commit}" "$HEAD_SHA"; then
              echo "::warning::commit ${HEAD_SHA} does not contain ${latest_tag}; not releasing it"
              exit 0
            fi
            IFS='.' read -r major minor patch <<< "$latest_tag"
            new_patch=$((patch + 1))
            new_tag="${major}.${minor}.${new_patch}"
            echo "new tag: ${new_tag}"

            # the fetch above saw no such tag, so one pushed since then points at another commit: releasing
            # HEAD_SHA under it would be wrong, and a re-run recomputes the tag
            if git ls-remote --tags origin "refs/tags/${new_tag}" | grep -q .; then
              echo "tag ${new_tag} appeared on the remote after the fetch; re-run to compute the next tag" >&2
              exit 1
            fi
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"
            git tag "$new_tag" "$HEAD_SHA"
            git push origin "$new_tag"
          fi

          # only the newest version is the latest release
          latest_flag=--latest=false
          if [ "$new_tag" = "$(semver_latest)" ]; then latest_flag=--latest; fi
          if ! gh release view "$new_tag" >/dev/null 2>&1; then
            # --generate-notes lists pull requests, and a direct push to main has none
            tags=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=v:refname)
            prev=$(awk -v t="$new_tag" '!/^[0-9]+\.[0-9]+\.[0-9]+$/ {next} $0 == t {print p; exit} {p = $0}' <<<"$tags")
            {
              git log --no-merges --format='- %s (%h)' "${prev:+$prev..}$new_tag"
              printf '\nImages, once the Push to ghcr run finishes:\n\n'
              printf '    docker pull ghcr.io/%s:%s\n' "${GITHUB_REPOSITORY,,}" "$new_tag" "${GITHUB_REPOSITORY,,}" "${new_tag}-desktop"
            } >"$RUNNER_TEMP/notes.md"
            gh release create "$new_tag" \
              --title="$new_tag" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "$latest_flag"
            # only a new release publishes: a re-run for a released commit must not rebuild and overwrite
            # the images of ${new_tag}
            printf 'tag=%s\n' "$new_tag" >> "$GITHUB_OUTPUT"
          else
            echo "release ${new_tag} already exists; this run does not publish again. To retry a failed publish: gh workflow run push.yaml --ref ${new_tag}"
          fi

      # tags pushed with GITHUB_TOKEN do not trigger other workflows, so start push.yaml explicitly, then wait
      # for it: a failed publish fails this run, whose actor is the one notified (push.yaml's actor is the bot)
      - name: Trigger GHCR build and wait for it
        # the previous step leaves no tag when it declined to release an older commit or the release existed
        if: steps.release.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "${RELEASE_TAG}" =~ ${semver_pattern} ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          # a margin absorbs the clock difference between this runner and GitHub, which stamps createdAt
          since=$(date -u -d '30 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "dispatching push.yaml for ${RELEASE_TAG}"
          gh workflow run push.yaml --ref "${RELEASE_TAG}"

          # gh workflow run does not print a run id that is safe to parse without a terminal, so look for
          # the run it created: a dispatch run for this tag that is newer than the dispatch
          run_id=
          for _ in $(seq 12); do
            run_id=$(gh run list --workflow push.yaml --event workflow_dispatch --json databaseId,headBranch,createdAt |
              jq -r --arg tag "${RELEASE_TAG}" --arg since "$since" \
                '[.[] | select(.headBranch == $tag and .createdAt >= $since)] | max_by(.createdAt) | .databaseId // empty')
            [ -z "$run_id" ] || break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "no push.yaml run for ${RELEASE_TAG} appeared within a minute of the dispatch" >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status --compact --interval 30
