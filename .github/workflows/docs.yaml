name: Docs
# ci.yaml skips pushes that touch only Markdown or llms.txt, so docs-only changes get these checks instead: the docs
# links, and a gitleaks scan, because a Markdown file can hold a key as well as any other. DESIGN.md changes run
# both, because lint also checks that file. It never releases: tag.yaml listens to CI alone.
on:
  push:
    branches: [main]
    paths: ["docs/**", "**/*.md", "llms.txt", "!home/.config/pi/**", "!home/.config/omp/**"]
  pull_request:
    paths: ["docs/**", "**/*.md", "llms.txt", "!home/.config/pi/**", "!home/.config/omp/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # lint:docs accepts the top-level names of every commit, so a renamed path is reported
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.23
          install: false
      - run: mise run lint:docs

  secrets:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # tools install from the URLs and checksums in .mise/mise.lock, so this job calls no GitHub API and needs no token
      MISE_LOCKED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history
          fetch-depth: 0
          persist-credentials: false
      # mise itself only; `mise run lint:secrets` installs gitleaks at the version pinned in .mise/mise.lock
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.23
          install: false
      - run: mise run lint:secrets
