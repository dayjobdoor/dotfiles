name: Full module
# Weekly smoke of the opt-in full toolbox. Not part of the tag chain, so a red run never blocks releases.
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# one full build at a time; a new run waits instead of cancelling the one in progress
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      # print the free disk before the build; the full image has exhausted the runner once ("No space left on device")
      - run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.23
          install: false
      # `docker build` loads its image into the runner's docker, whose default image store (containerd's) gzips all
      # the layers and unpacks them again: about 115 s for the 6.4 GB of the default image. The classic store
      # (overlay2) takes 18 to 25 s for the same export, and is what a developer's docker usually runs (probe of
      # November 2026, docs/maintenance.md). act has no systemd and uses the host's docker, so the step does not run there.
      - name: Use the classic image store
        if: ${{ !env.ACT }}
        run: |
          set -o pipefail
          sudo mkdir -p /etc/docker
          if [ -s /etc/docker/daemon.json ]; then sudo cat /etc/docker/daemon.json; else echo '{}'; fi |
            jq '.features["containerd-snapshotter"] = false' | sudo tee /etc/docker/daemon.json.new >/dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          for _ in $(seq 15); do docker info >/dev/null 2>&1 && break; sleep 1; done
          test "$(docker info --format '{{.Driver}}')" = overlay2
      - name: Build full image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise trust .mise/config.toml && mise run build full
      - name: Doctor
        # djd:full is the image the previous step built on this runner, not a pulled one
        run: docker run --rm djd:full djd doctor # jactionlint ignore=unpinned-images
      - name: Update
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # the only run of `djd update`: a machine upgrading itself to the newest mise and tools while the
        # other jobs stay on the pinned mise
        run: docker run --rm -e MISE_GITHUB_TOKEN djd:full zsh -lc 'djd update && djd doctor' # jactionlint ignore=unpinned-images
