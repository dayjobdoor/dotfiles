name: djd
services:
  ubuntu:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        DJD_MODULES: "agent"
      secrets:
        - github_token
    hostname: container
    user: root
    entrypoint: ["djd-desktop-entrypoint"]
    # the password comes from the djd_rdp_password secret, so it is in neither argv nor `docker inspect`
    command: ["dayjobdoor"]
    secrets:
      - djd_rdp_password
    ports:
      - "127.0.0.1:3589:3389"
    shm_size: 512m # browsers in the session crash with the 64m default
    restart: unless-stopped
    init: true # docker-init is PID 1: it forwards signals to xrdp and reaps zombies
    # xrdp listening is what a client needs; with `up --wait` (mise run up) a container that crash-loops, as it does
    # with an empty PASSWORD, fails the command instead of reporting a start that did not hold
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3389"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional remote access through a Cloudflare Tunnel: set TUNNEL_TOKEN in the env file, uncomment this, and point
  # the tunnel's public hostname at ubuntu:3389 in the Cloudflare dashboard. Clients need cloudflared. It opens
  # password RDP beyond this machine, so keep Cloudflare Access in front of it.
  # tunnel:
  #   image: cloudflare/cloudflared
  #   command: tunnel run
  #   environment:
  #     TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
  #   restart: unless-stopped

secrets:
  github_token:
    environment: GITHUB_TOKEN
  # compose stops with an error when PASSWORD is unset; an empty one stops the entrypoint
  djd_rdp_password:
    environment: PASSWORD
